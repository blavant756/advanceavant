<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advance Avant - G1Journey</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      color: #c00000;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .button {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #c00000;
      color: #fff;
      text-decoration: none;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin: 10px 0;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button:hover {
      background-color: #a00000;
    }

    .icon {
      width: 24px;
      height: 24px;
    }

    .socials {
      display: flex;
      gap: 15px;
      margin-top: 1rem;
    }

    .socials a {
      display: inline-block;
      width: 40px;
      height: 40px;
    }

    .socials img {
      width: 100%;
      height: 100%;
    }

    .qr-section {
      margin-top: 2rem;
      text-align: center;
    }

    .qr-section img {
      width: 180px;
      height: 180px;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Advance Avant LLC</h1>
  <p>For All Your Travel Needs</p>

  <a class="button" href="https://calendly.com/blavant756" target="_blank" rel="noopener">
    <img src="calendar-icon.png" alt="Calendar icon" class="icon" />
    Book a Discovery Call
  </a>

  <a class="button" href="https://brendaavant.inteletravel.com/booktravel.cfm" target="_blank" rel="noopener">
    <img src="globe-icon.png" alt="Globe icon" class="icon" />
    Visit Booking Site
  </a>

  <div class="socials">
    <a href="https://www.facebook.com/Brenda.Avant.18" target="_blank" rel="noopener">
      <img src="facebook-icon.png" alt="Facebook icon" />
    </a>
    <a href="https://www.instagram.com/brenda.avant.18" target="_blank" rel="noopener">
      <img src="instagram-icon.png" alt="Instagram icon" />
    </a>
    <a href="https://www.linkedin.com/in/Brenda-Avant-051164140/" target="_blank" rel="noopener">
      <img src="linkedin-icon.png" alt="LinkedIn icon" />
    </a>
    <a href="https://www.tiktok.com/@brendaavant42" target="_blank" rel="noopener">
      <img src="tiktok-icon.png" alt="TikTok icon" />
    </a>
  </div>

  <div class="qr-section">
    <h2>Scan to Book</h2>
    <img src="your-qr-code.png" alt="QR code to booking site" />
  </div>
</body>
</html>
